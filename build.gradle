plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = mod_group_id
version = mod_version

base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Compile-only boundaries: this addon must not bundle Dominion Sword or Superb Warfare.
    // Example:
    //   -Pdominionsword_jar=../DominionSword-1.20.1/build/libs/dominionsword-1.0.9.jar
    //   -Psuperbwarfare_jar=../SuperbWarfare-superbwarfare/build/libs/superbwarfare.jar
    if (project.hasProperty('dominionsword_jar')) {
        compileOnly files(project.property('dominionsword_jar'))
    }
    if (project.hasProperty('superbwarfare_jar')) {
        compileOnly files(project.property('superbwarfare_jar'))
    }
}

tasks.named('processResources', ProcessResources).configure {
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 forge_version: forge_version, forge_version_range: forge_version_range,
                 loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
                 mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
                 mod_description: mod_description]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props + [project: project] }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
